[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# Secure API Reverse-Proxy to Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://jennie-your-2nd-love-music-app-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA single-page routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "autoplay=*, encrypted-media=*"
