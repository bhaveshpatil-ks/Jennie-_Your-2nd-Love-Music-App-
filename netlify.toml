[build]
  command = "npm run build"
  publish = "dist"

# Secure API Reverse-Proxy: Shields backend URL and prevents public exposure of Railway host
[[redirects]]
  from = "/api/*"
  to = "https://jennie-your-2nd-love-music-app-production.up.railway.app/api/:splat"
  status = 200
  force = true

# Single Page Application routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "autoplay=*, encrypted-media=*"
